# Studio51 standard repository settings.
#
# Every repo in the studio51 and games-directory orgs is configured identically
# (Common Standard, "GitHub repository settings").
#
# `npx @studio51/create settings` applies all of this through the GitHub API,
# ruleset included. This file mirrors it for the GitHub "Settings" app
# (https://github.com/apps/settings) wherever that app is installed; keep the
# two in step (cli/lib/settings.js in the standards repo).
#
# GitHub defaults kept on, not set here: comments on individual commits, and
# auto-closing issues when a linked pull request merges.

repository:
  # Features every repo keeps enabled.
  has_issues: true
  has_projects: true
  has_wiki: true
  has_discussions: true

  # Merge commits only: never squash, never rebase. The merge commit takes the
  # pull request's title and body.
  allow_merge_commit: true
  allow_squash_merge: false
  allow_rebase_merge: false
  merge_commit_title: PR_TITLE
  merge_commit_message: PR_BODY

  # Always offer the "Update branch" button on out-of-date PRs.
  allow_update_branch: true
  # Delete the head branch automatically once a PR merges.
  delete_branch_on_merge: true
  # Require contributors to sign off on commits made through the web UI.
  web_commit_signoff_required: true

# Signed commits only on every integration and release branch, with force
# pushes and deletion blocked. There is deliberately no pull request
# requirement and no required status check: work lands on these branches
# directly, and either would block it.
rulesets:
  - name: Studio51 standard
    target: branch
    enforcement: active
    conditions:
      ref_name:
        include:
          - "~DEFAULT_BRANCH"
          - refs/heads/develop
          - refs/heads/main
          - refs/heads/master
        exclude: []
    rules:
      - type: required_signatures
      - type: non_fast_forward
      - type: deletion
